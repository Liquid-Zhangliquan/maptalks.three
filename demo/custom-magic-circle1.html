<!DOCTYPE html>
<html>

<head>
    <title>Customize simple animation </title>
    <script type="text/javascript" src="https://unpkg.com/dat.gui@0.7.6/build/dat.gui.min.js"></script>
    <link type="text/css" rel="stylesheet" href="https://unpkg.com/maptalks/dist/maptalks.css">
    <script type="text/javascript" src="https://unpkg.com/maptalks/dist/maptalks.js"></script>
    <script type="text/javascript" src="https://unpkg.com/@maptalks/gl/dist/maptalksgl.js"></script>
    <script type="text/javascript" src="https://unpkg.com/three@0.138.0/build/three.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/maptalks.three@latest/dist/maptalks.three.js"></script>
    <style>
        html,
        body {
            margin: 0px;
            height: 100%;
            width: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #000;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>

        var map = new maptalks.Map("map", {
            center: [13.384062075483484, 52.52392452635709],
            zoom: 14,
            pitch: 0,
            bearing: 0,

            centerCross: true,
            doubleClickZoom: false,
            baseLayer: new maptalks.TileLayer('tile', {
                urlTemplate: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                subdomains: ['a', 'b', 'c', 'd'],
                attribution: '&copy; <a href="http://osm.org">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/">CARTO</a>'
            })
        });


        var threeLayer = new maptalks.ThreeLayer('t', {
            forceRenderOnMoving: true,
            forceRenderOnRotating: true,
            // animation: true
        });


        threeLayer.prepareToDraw = function (gl, scene, camera) {
            var light = new THREE.DirectionalLight(0xffffff);
            light.position.set(0, -10, 10).normalize();
            scene.add(light);
            addCircles();
            threeLayer.config('animation', true);

        };
        const sceneConfig = {
            postProcess: {
                enable: true,
                antialias: { enable: true }
            }
        };
        const groupLayer = new maptalks.GroupGLLayer('group', [threeLayer], { sceneConfig });
        groupLayer.addTo(map);

        var color = "#fdeb1e";
        async function getMaterial(opts) {
            const { textUrl, fillColor, speed, direction, angle, intensity } = opts

            let texture = await new THREE.TextureLoader().load(textUrl)
            texture.wrapS = THREE.ClampToEdgeWrapping
            texture.wrapT = THREE.ClampToEdgeWrapping
            texture.needsUpdate = true; //使用贴图时进行更新
            // texture.center = new THREE.Vector2(0.5, 0.5)// 使纹理居中
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    iTime: {
                        type: 'f',
                        value: 0
                    },
                    intensity: {
                        type: 'f',
                        value: intensity
                    },
                    speed: {
                        type: 'f',
                        value: speed
                    },
                    direction: {
                        type: 'f',
                        value: direction
                    },
                    angle: {
                        type: 'f',
                        value: angle
                    },
                    map: {
                        type: 't',
                        value: texture
                    },
                    color: {
                        type: "c",
                        value: new THREE.Color(fillColor)
                    },
                    opacity: {
                        type: "f",
                        value: 1
                    }
                },
                vertexShader: `
            varying vec2 vUv;
            void main()	{
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
            }`,
                fragmentShader: `      
uniform float iTime;
uniform float intensity; 
uniform float speed; 
uniform float direction; 
uniform float angle; 
uniform vec3 color;
uniform sampler2D map;
uniform float opacity;
varying vec2 vUv;
const float DEGREE = 0.2;


// 将坐标st 平移dis,返回新的坐标
vec2 translate2d(vec2 st,vec2 dis){
  return st+dis;
}

// 将坐标st，旋转 _angle度
vec2 rotate2d(vec2 st,float _angle){
  float rad=radians(_angle);
  // 旋转矩阵
  mat2 rotateMat=mat2(cos(rad),-sin(rad),
                      sin(rad),cos(rad));
  st*=rotateMat;
  return st;
}


void main() {
/**
   *平移可以直接移动，旋转与缩放需要先将元素移动到原点
   *处理完成后再移动到原来的位置
  **/
  vec2 st = translate2d(vUv,vec2(-0.5));
  st = rotate2d(st,direction*speed*iTime*angle);
  st = translate2d(st,vec2(0.5));
  vec4 tex = texture2D(map, st);
//   float alpha = tex.a; // 获取像素的alpha值
//     if (alpha > 0.0) { // 如果不是透明像素
//         vec3 glow = u_glowColor * u_glowIntensity; // 计算发光颜色
//         tex.rgb += glow; // 加上发光颜色
//     }
  vec4 glowColor = vec4(color, opacity) * intensity;
  gl_FragColor = vec4(tex.rgb * color, tex.a * opacity)+glowColor;
}
                `,

                side: THREE.DoubleSide,
                // transparent: true,
                // alphaTest: 0.01,

                blending: THREE.AdditiveBlending,
                transparent: !0,
                depthWrite: !1,
                depthTest: !0,
            });
            return material;
        }

        var circles;
        var circle1, circle2;
        async function addCircles() {
            var lnglat = [13.384062075483484, 52.52392452635709];
            const opt1 = {
                textUrl: '/data/ring_9.png',
                fillColor: "#fdeb1e",
                speed: 1,
                direction: 1,
                angle: 30,
                intensity: 0.0
            }
            var material1 = await getMaterial(opt1);
            circle1 = new Circle(lnglat, {
                radius: 800,
            }, material1, threeLayer);
            const opt2 = {
                textUrl: '/data/ring_8.png',
                fillColor: "#fdeb1e",
                speed: 1,
                direction: -1,
                angle: 60,
                intensity: 0.0
            }
            var material2 = await getMaterial(opt2);
            circle2 = new Circle(lnglat, {
                radius: 1900,
            }, material2, threeLayer);
            circles = [circle1, circle2]
            threeLayer.addMesh(circles);

            initGui();
        }



        function initGui() {
            var params = {
                add: true,
                color: color,
                radius: 800,
                show: true,
                opacity: 1,
                altitude: 0,
                speed: 1,
                direction: 1,
                angle: 30,
                intensity: 0
            };

            var gui = new dat.GUI();
            gui.add(params, 'add').onChange(function () {
                if (params.add) {
                    threeLayer.addMesh(circles);
                } else {
                    threeLayer.removeMesh(circles);
                }
            });
            gui.add(params, 'show').onChange(function () {
                circles.forEach(function (mesh) {
                    if (params.show) {
                        mesh.show();
                    } else {
                        mesh.hide();
                    }
                });
            });
            gui.addColor(params, 'color').name('circle color').onChange(function (value) {
                circle2.getObject3d().material.uniforms.color.value = new THREE.Color(params.color);
            });
            gui.add(params, 'radius', 0, 3000).name('circle radius').onChange(function () {
                circle2.setRadius(params.radius);
            });
            gui.add(params, 'opacity', 0, 1).onChange(function () {
                circle2.getObject3d().material.uniforms.opacity.value = params.opacity;
            });
            gui.add(params, 'altitude', 0, 300).onChange(function () {
                circle2.setAltitude(params.altitude);
            });
            gui.add(params, 'speed', 1, 10).onChange(function (value) {
                circle2.getObject3d().material.uniforms.speed.value = value;
            });
            gui.add(params, 'direction', -1, 1).onChange(function (value) {
                circle2.getObject3d().material.uniforms.direction.value = value;
            });
            gui.add(params, 'angle', 0, 360).onChange(function (value) {
                circle2.getObject3d().material.uniforms.angle.value = value;
            });
            gui.add(params, 'intensity', 0, 1).onChange(function (value) {
                circle2.getObject3d().material.uniforms.intensity.value = value;
            });
        }




        //default values
        var OPTIONS = {
            radius: 100,
            altitude: 0
        };

        /**
         * custom Circle component
         * 
         * you can customize your own components
         * */

        class Circle extends maptalks.BaseObject {
            constructor(coordinate, options, material, layer) {
                options = maptalks.Util.extend({}, OPTIONS, options, { layer, coordinate });
                super();
                //Initialize internal configuration
                // https://github.com/maptalks/maptalks.three/blob/1e45f5238f500225ada1deb09b8bab18c1b52cf2/src/BaseObject.js#L135
                this._initOptions(options);
                const { altitude, radius } = options;
                //generate geometry
                const r = layer.distanceToVector3(radius, radius).x
                const geometry = new THREE.CircleBufferGeometry(r, 50);
                // const geometry = new THREE.PlaneGeometry(radius * 2, radius * 2)

                //Initialize internal object3d
                // https://github.com/maptalks/maptalks.three/blob/1e45f5238f500225ada1deb09b8bab18c1b52cf2/src/BaseObject.js#L140
                this._createMesh(geometry, material);

                //set object3d position
                const z = layer.altitudeToVector3(altitude, altitude).x;
                const position = layer.coordinateToVector3(coordinate, z);
                this.getObject3d().position.copy(position);
            }

            setRadius(radius) {
                const r = this.getLayer().distanceToVector3(radius, radius).x
                const geometry = new THREE.CircleBufferGeometry(r, 50);
                this.object3d.geometry = geometry
            }

            // test animation
            _animation() {
                if (this.getObject3d().material) {
                    this.getObject3d().material.uniforms.iTime.value += 1.0 / 60.0;
                }
            }
        }






    </script>
</body>

</html>
